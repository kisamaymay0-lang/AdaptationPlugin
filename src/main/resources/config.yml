settings:
  # Время действия обычной адаптации в секундах
  duration-normal: 10
  
  # Время действия повышенной адаптации в секундах
  duration-super: 4

  # Bonus времени в секундах за каждый профильный удар
  hit-bonus-normal: 0.2
  hit-bonus-super: 0.4

  # Сколько нужно получить ударов для обычной адаптации в зависимости от уровня
  required-hits:
    lvl1: 10
    lvl2: 8
    lvl3: 6

  # Сколько ударов нужно получить во время обычной адаптации для перехода в супер-режим
  required-super-hits: 8

  # НАСТРОЙКИ СИЛЫ ЗАЩИТЫ БРОНИ:
  # Сколько защиты дает 1 предмет в обычной адаптации (0.075 = 7.5% за штуку. Full сет из 4 предметов = 30% защиты)
  normal-protection-per-piece: 0.075

  # Сколько защиты дает 1 предмет в повышенной адаптации (0.125 = 12.5% за штуку. Full сет из 4 предметов = 50% защиты)
  super-protection-per-piece: 0.125
